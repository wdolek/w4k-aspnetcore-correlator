name: Build and test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --nologo --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release
